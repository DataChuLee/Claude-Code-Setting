# 테스트·린트·타입·PR 크기 검사. 두 경로:
# - pull_request: 사람이 PR을 열거나 push하거나 Ready로 바꿀 때 → PR head에 `check`가 붙는다 = 머지 조건
#   (Ruleset required check. 봇의 GITHUB_TOKEN 이벤트는 워크플로를 트리거하지 않으므로 봇만으로는 이 check가 생기지 않음)
# - workflow_call: agent-build/agent-fix가 에이전트에게 빠른 피드백용으로 호출 (결과는 PR head가 아니라 run 로그에)
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      pr:
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ inputs.pr || github.event.pull_request.number }}
      MAX_CHANGED_LINES: 500
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: refs/pull/${{ env.PR }}/head
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: 의존성
        run: |
          pip install pytest ruff mypy pyyaml
          if [ -d src ]; then pip install -e ".[dev]"; fi
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: mypy
        run: |
          # shellcheck disable=SC2046  # 있는 폴더만 인자로 넘기려는 의도된 단어 분리 (경로에 공백 없음)
          python -m mypy $(ls -d src tests .claude/hooks .github/scripts 2>/dev/null)
      - name: actionlint (워크플로 문법·shellcheck)
        env:
          V: 1.7.12
          # 릴리스 actionlint_1.7.12_checksums.txt의 linux_amd64 값. 버전을 올리면 함께 바꾼다
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: PR 크기
        # 사람용 문서(*.md)는 세지 않는다. 에이전트 동작을 바꾸는 md(.claude/ 아래, 모든 CLAUDE.md)는 센다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            | jq -s '[add[] | select((.filename | endswith(".md")) and (.filename | startswith(".claude/") or endswith("CLAUDE.md") | not) | not) | .additions + .deletions] | add // 0')
          echo "바뀐 줄(사람용 문서 제외): $n (상한 $MAX_CHANGED_LINES)"
          if [ "$n" -gt "$MAX_CHANGED_LINES" ]; then
            echo "::error::PR이 ${MAX_CHANGED_LINES}줄을 넘습니다 ($n). 이슈를 쪼개세요"
            exit 1
          fi
