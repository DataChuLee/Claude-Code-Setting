name: my-dev-setup
version: 2.0.0
description: "AI-Native 하네스 — SDD + TDD (+ LLM 프로젝트는 Eval). 참고용 문서, Claude Code에서 자동 인식되지 않음"
author: qasd1

# 실제 동작은 settings.json(permissions, hooks)과 .claude/ 디렉토리 구조로 이뤄짐
# 이 파일은 구성 요소 목록을 파악하기 위한 참고 문서임

components:
  instructions:
    - CLAUDE.md               # 하네스 지도
  skills:                     # 자연어 자동 실행 + /이름 호출
    - skills/spec
    - skills/tdd
    - skills/eval
    - skills/gate-reset       # 사람만 실행
    - skills/review
    - skills/doc
    - skills/commit
    - skills/ship             # push + draft PR
    - skills/scaffold
    - skills/api-conventions
    - skills/code-quality
  agents:
    - agents/builder.md       # 설계 + 테스트 먼저
    - agents/reviewer.md      # 리뷰 + 문서화
  hooks:
    - hooks/run_guard.py      # PreToolUse 진입점
    - hooks/guard.py          # 위험 명령·시크릿·리뷰 없는 커밋 차단
    - hooks/gate.py           # Stop 게이트·PostToolUse ruff·SubagentHandback 리뷰 기록·/gate-reset
  github:
    - ../.github/pull_request_template.md   # PR 본문 6개 항목 (ship이 채움)
    - ../.github/workflows/ci.yml           # pytest·ruff·mypy·PR 크기 (500줄)
    - ../.github/workflows/agent-spec.yml   # 라벨 agent:spec → SPEC 댓글
    - ../.github/workflows/agent-build.yml  # 라벨 agent:build → draft PR → ci·review
    - ../.github/workflows/claude-review.yml # PR 리뷰 댓글 (읽기 + 댓글만)
    - ../.github/workflows/agent-fix.yml    # 소유자 @claude 댓글 → 수정 (최대 2라운드)
